<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karachi Property Trust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script>
  try {
    document.documentElement.dataset.theme = localStorage.getItem('kpt-theme') /* STORAGE_KEYS.theme in js/config.js */ === 'dark' ? 'dark' : 'light';
  } catch (error) {
    document.documentElement.dataset.theme = 'light';
  }
</script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/owner-verification.css">
<link rel="stylesheet" href="css/browse.css">
<link rel="stylesheet" href="css/overlays.css">
<link rel="stylesheet" href="css/property.css">
<link rel="stylesheet" href="css/promo.css">
<link rel="stylesheet" href="css/verify-document.css">
<link rel="stylesheet" href="css/camera.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<nav class="topnav" id="topnav">
  <div class="topnav-inner">
    <button class="topnav-brand brand-logo-animated" onclick="nav('home')" aria-label="Karachi Property Trust home">
      <img class="topnav-icon" src="assets/logo-icon-trim.png" alt="Karachi Property Trust">
      <span class="topnav-text">
        <span class="topnav-name">Karachi Property Trust</span>
        <span class="topnav-tag">Verification &amp; Trust Management</span>
      </span>
    </button>
    <button class="theme-toggle" id="themeToggle" type="button" role="switch" aria-checked="false" aria-label="Switch to dark theme" title="Switch to dark theme" onclick="toggleTheme()">
      <span class="theme-toggle-track" aria-hidden="true">
        <svg class="theme-toggle-icon moon" viewBox="0 0 24 24"><path d="M20.3 15.1A8.5 8.5 0 0 1 8.9 3.7 8.6 8.6 0 1 0 20.3 15.1Z"/><path d="M16.8 3.2v2.2M15.7 4.3h2.2M20.3 7v1.6M19.5 7.8h1.6"/></svg>
        <svg class="theme-toggle-icon sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
        <span class="theme-toggle-thumb"></span>
      </span>
    </button>
    <button class="topnav-menu" onclick="openDrawer()" aria-label="Open menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
</nav>
<div class="wrap" id="app"></div>

<div class="overlay-bg" id="overlayBg"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-head-row">
      <div>
        <div class="dname">Karachi Property Trust</div>
        <div class="dsub">Verification &amp; Trust Management</div>
      </div>
      <div class="drawer-logo" id="drawerLogo"><img src="assets/logo-icon-trim.png" alt="Karachi Property Trust"></div>
    </div>
  </div>
  <div class="drawer-nav" id="drawerNav"></div>
  <div class="drawer-foot">
    <button class="drawer-mission" onclick="openChat();closeDrawer();">💡 Learn how verification works</button>
  </div>
</div>

<button class="chat-fab" id="chatFab" onclick="openChat()" aria-label="Property Assistance">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-9 8.4A8.5 8.5 0 1 1 21 11.5Z"/><path d="M9.6 9.2a2.4 2.4 0 1 1 3.5 2.1c-.8.4-1.3 1-1.3 1.9"/><circle cx="11.8" cy="15.8" r=".6" fill="currentColor" stroke="none"/></svg>
</button>
<div class="chat-panel" id="chatPanel">
  <div class="chat-head">
    <div><h3>Property Assistance</h3><span>Ask about Karachi property prices, areas, and listings.</span></div>
    <button class="icon-btn" style="background:var(--teal-100);color:var(--teal-700)" onclick="closeChat()" aria-label="Close chat">✕</button>
  </div>
  <div class="chat-body" id="chatBody"></div>
</div>

<div class="promo" id="promo"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
